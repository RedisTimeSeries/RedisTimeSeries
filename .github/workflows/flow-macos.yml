name: MOD-20655 bounded macOS diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-26-intel
    timeout-minutes: 25
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: redis/redis
          ref: 41888396080aab24ad5218f2e45e66158e24884b
          path: redis
          submodules: recursive
      - name: Prerequisites
        run: |
          brew install make coreutils autoconf automake pyenv-virtualenv libtool
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Setup
        working-directory: .install
        run: ./install_script.sh
      - uses: ./.github/actions/install-python-deps
        with:
          use-venv: '1'
          extra-packages-to-install: gevent
      - uses: ./.github/actions/build-module-and-redis
        with:
          use-venv: '1'
      - name: Three bounded original-test attempts
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          source venv/bin/activate
          module_path=$(find "$PWD/bin" -name redistimeseries.so -type f | head -1)
          test -n "$module_path"
          export REDIS_SERVER="$PWD/redis/src/redis-server"
          git rev-parse HEAD
          git -C redis rev-parse HEAD
          python -m pip show RLTest
          cd tests/flow
          for attempt in 1 2 3; do
            gtimeout 75 python -m RLTest --oss-redis-path "$REDIS_SERVER" \
              --module "$module_path" --enable-debug-command --enable-protected-configs \
              --cluster_bus_port_protected_mode no --env oss-cluster --shards-count 3 \
              --test-timeout 45 --test test_mod20655_diagnostics:test_expiry_diagnostics \
              --log-dir "logs/mod20655-attempt-$attempt" 2>&1 | tee "mod20655-attempt-$attempt.log"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mod20655-macos26-intel-diagnostics
          path: |
            tests/flow/logs/**
            tests/flow/mod20655-attempt-*.log
          retention-days: 7
          if-no-files-found: warn
