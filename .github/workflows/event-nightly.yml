name: Event Nightly

permissions:
  id-token: write
  contents: read

on:
  schedule:
    - cron: '20 20 * * *' # 20:20 UTC every day
  push: # To verify full nightly build after PR is merged
    branches:
      - main
      - master
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      redis-ref-flex:
        description: 'Redis ref for the Flex (Big-Redis) leg (redislabsdev/Redis)'
        required: true
        default: 'rl_big2_unstable'
      redis-ref:
        description: 'Default redis branch — Linux jobs consume it as `rl_${ref}` on redislabsdev/Redis, macOS consumes it as `${ref}` on redis/redis (OSS). Use an unprefixed branch name so the same value resolves on both forks.'
        required: true
        default: 'unstable'
jobs:
  prepare-values:
    runs-on: ubuntu-latest
    outputs:
      redis-ref-flex: ${{ steps.set-env.outputs.redis-ref-flex }}
      redis-ref: ${{ steps.set-env.outputs.redis-ref }}
      beta-timestamp: ${{ steps.set-env.outputs.beta-timestamp }}
      beta-version: ${{ steps.set-env.outputs.beta-version }}
      module-version: ${{ steps.get-version.outputs.module-version }}
      snapshot-template: ${{ steps.set-env.outputs.snapshot-template }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set env
        id: set-env
        run: |
          echo "redis-ref-flex=${{ inputs.redis-ref-flex || 'rl_big2_unstable' }}" >> $GITHUB_OUTPUT
          echo "redis-ref=${{ inputs.redis-ref || 'unstable' }}" >> $GITHUB_OUTPUT

          # Generate timestamp at workflow start for consistent beta versioning
          TIMESTAMP=$(date -u +"%Y%m%d.%H%M%S")
          WORKFLOW_NUM=${{ github.run_number }}
          BETA_VERSION="99.99.99.${TIMESTAMP}.${WORKFLOW_NUM}"

          echo "beta-timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "beta-version=${BETA_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated beta version: ${BETA_VERSION}"

          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_NAME="${BRANCH_NAME//[^A-Za-z0-9._-]/_}"
          SNAPSHOT_TEMPLATE="redistimeseries/snapshots/redistimeseries.@OS.${BRANCH_NAME}.${TIMESTAMP}.${WORKFLOW_NUM}.zip"
          echo "snapshot-template=${SNAPSHOT_TEMPLATE}" >> $GITHUB_OUTPUT
          echo "Snapshot template: ${SNAPSHOT_TEMPLATE}"

      - name: Extract module version
        id: get-version
        run: |
          MAJOR=$(grep '#define REDISTIMESERIES_VERSION_MAJOR' src/version.h | awk '{print $3}')
          MINOR=$(grep '#define REDISTIMESERIES_VERSION_MINOR' src/version.h | awk '{print $3}')
          PATCH=$(grep '#define REDISTIMESERIES_VERSION_PATCH' src/version.h | awk '{print $3}')
          MODULE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "module-version=${MODULE_VERSION}" >> $GITHUB_OUTPUT
          echo "Module version: ${MODULE_VERSION}"

      - name: Summary
        run: |
          echo "### Nightly Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Module Version:** ${{ steps.get-version.outputs.module-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Snapshot Template:** \`${{ steps.set-env.outputs.snapshot-template }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Create build metadata
        run: |
          echo '{}' | jq \
            --arg snapshot_template "$SNAPSHOT_TEMPLATE" \
            --arg module_version "$MODULE_VERSION" \
            --arg beta_version "$BETA_VERSION" \
            '{snapshot_template: $snapshot_template, module_version: $module_version, beta_version: $beta_version}' \
            > build-metadata.json
        env:
          SNAPSHOT_TEMPLATE: ${{ steps.set-env.outputs.snapshot-template }}
          MODULE_VERSION: ${{ steps.get-version.outputs.module-version }}
          BETA_VERSION: ${{ steps.set-env.outputs.beta-version }}

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build-metadata.json
  linter:
    uses: ./.github/workflows/flow-linter.yml
    secrets: inherit

  # --- Flex (Big-Redis) leg: rl_big2_unstable ---
  build-linux-x64-flex:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: focal jammy rocky8 rocky9 amazonlinux2 amazonlinux2023 azurelinux3
      redis-ref: ${{needs.prepare-values.outputs.redis-ref-flex}}
      bigredis_tests: true
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      quick: false
    secrets: inherit
  build-linux-arm64-flex:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: arm64
      os: focal jammy rocky9 azurelinux3 amazonlinux2023 rocky8
      redis-ref: ${{needs.prepare-values.outputs.redis-ref-flex}}
      bigredis_tests: true
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      quick: false
    secrets: inherit
  linux-valgrind-flex:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: jammy
      redis-ref: ${{needs.prepare-values.outputs.redis-ref-flex}}
      bigredis_tests: true
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      run_valgrind: true
    secrets: inherit
  linux-sanitizer-flex:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: jammy
      redis-ref: ${{needs.prepare-values.outputs.redis-ref-flex}}
      bigredis_tests: true
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      run_sanitizer: true
    secrets: inherit

  # --- Default Linux leg: rl_${redis-ref} on the private fork ---
  build-linux-x64:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: focal jammy rocky8 rocky9 amazonlinux2 amazonlinux2023 azurelinux3
      redis-ref: rl_${{needs.prepare-values.outputs.redis-ref}}
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      quick: false
    secrets: inherit
  build-linux-arm64:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: arm64
      os: focal jammy rocky9 azurelinux3 amazonlinux2023 rocky8
      redis-ref: rl_${{needs.prepare-values.outputs.redis-ref}}
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      quick: false
    secrets: inherit
  linux-valgrind:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: jammy
      redis-ref: rl_${{needs.prepare-values.outputs.redis-ref}}
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      run_valgrind: true
    secrets: inherit
  linux-sanitizer:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: jammy
      redis-ref: rl_${{needs.prepare-values.outputs.redis-ref}}
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      run_sanitizer: true
    secrets: inherit

  # macOS stays on OSS (redis/redis) per migration plan — not on the private fork.
  macos:
    uses: ./.github/workflows/flow-macos.yml
    needs: [prepare-values]
    with:
      redis-ref: ${{needs.prepare-values.outputs.redis-ref}}
      beta-version: ${{needs.prepare-values.outputs.beta-version}}
      quick: false
    secrets: inherit
