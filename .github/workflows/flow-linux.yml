name: MOD-20654 bounded original-image diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DIAGNOSTIC_IMAGE: ghcr.io/redistimeseries/redistimeseries/redistimeseries-x86-jammy-valgrind@sha256:727de92a09a3607d38862e804a2c28279e05c34c934ed2abe0e693bb3cb02af0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Pull original CI image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$DIAGNOSTIC_IMAGE"
          docker image inspect "$DIAGNOSTIC_IMAGE" --format '{{json .RepoDigests}}'
      - name: Build and run original topology test
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker run --rm --name mod20654-diagnostic --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -v "$PWD:/workspace" -w /workspace "$DIAGNOSTIC_IMAGE" \
            bash -c 'set -o pipefail; redis-server --version; valgrind --version; timeout 540 make test VG=1 SAN= QUICK=0 TEST_TIMEOUT=180 TEST=test_topology_events:test_add_and_remove_node GEN=0 SLAVES=0 AOF=0 AOF_SLAVES=0 OSS_CLUSTER=1 TLS_CLUSTER=0 2>&1 | tee /workspace/mod20654-diagnostic.log'
      - name: Cleanup test container
        if: always()
        run: |
          docker rm -f mod20654-diagnostic 2>/dev/null || true
          test -z "$(docker ps -aq --filter name=mod20654-diagnostic)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mod20654-original-x86-diagnostics
          path: |
            mod20654-diagnostic.log
            tests/flow/logs/**
          retention-days: 7
          if-no-files-found: warn
