name: Event CI

permissions:
  id-token: write
  contents: read
  packages: read

on:
  pull_request:
    paths-ignore:
      - 'src/version.h'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-values:
    runs-on: ubuntu-latest
    outputs:
      redis-ref: ${{ steps.set-env.outputs.redis-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: set env
        id: set-env
        run: |
          echo "redis-ref=$(.install/get-redis-ref.sh)" >> "$GITHUB_OUTPUT"
  # MOD-17216 diagnostic branch only: four cluster test jobs, no other suites.
  build-linux-x64-full:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: jammy
      redis-ref: ${{needs.prepare-values.outputs.redis-ref}}
      quick: false
      use_prebuilt_images: ${{ !contains(github.event.pull_request.labels.*.name, 'docker-image-changes') }}
      shard_topologies: true
      mod17216_focused: true
    secrets: inherit
  build-linux-arm64-full:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: arm64
      os: jammy
      redis-ref: ${{needs.prepare-values.outputs.redis-ref}}
      quick: false
      use_prebuilt_images: ${{ !contains(github.event.pull_request.labels.*.name, 'docker-image-changes') }}
      shard_topologies: true
      mod17216_focused: true
    secrets: inherit
