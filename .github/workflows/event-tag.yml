name: Event TAG

permissions:
  id-token: write
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      redis-ref-flex:
        description: 'Redis ref for the Flex (Big-Redis) leg (redislabsdev/Redis)'
        required: true
        default: 'rl_big2_unstable'
      redis-ref:
        description: 'Default redis branch — Linux jobs consume it as `rl_${ref}` on redislabsdev/Redis, macOS consumes it as `${ref}` on redis/redis (OSS). Use an unprefixed branch name so the same value resolves on both forks.'
        required: true
        default: 'unstable'

jobs:
  prepare-values:
    runs-on: ubuntu-latest
    outputs:
      redis-ref-flex: ${{ steps.set-env.outputs.redis-ref-flex }}
      redis-ref: ${{ steps.set-env.outputs.redis-ref }}
    steps:
      - name: set env
        id: set-env
        run: |
          echo "redis-ref-flex=${{ inputs.redis-ref-flex || 'rl_big2_unstable' }}" >> $GITHUB_OUTPUT
          echo "redis-ref=${{ inputs.redis-ref || 'unstable' }}" >> $GITHUB_OUTPUT
  linter:
    uses: ./.github/workflows/flow-linter.yml
    secrets: inherit

  # --- Flex (Big-Redis) leg: rl_big2_unstable ---
  build-linux-x64-flex:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: focal jammy rocky8 rocky9 amazonlinux2 amazonlinux2023 azurelinux3
      redis-ref: ${{needs.prepare-values.outputs.redis-ref-flex}}
      bigredis_tests: true
    secrets: inherit
  build-linux-arm64-flex:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: arm64
      os: focal jammy rocky9 azurelinux3 amazonlinux2023 rocky8
      redis-ref: ${{needs.prepare-values.outputs.redis-ref-flex}}
      bigredis_tests: true
    secrets: inherit

  # --- Default Linux leg: rl_${redis-ref} on the private fork ---
  build-linux-x64:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: x64
      os: focal jammy rocky8 rocky9 amazonlinux2 amazonlinux2023 azurelinux3
      redis-ref: rl_${{needs.prepare-values.outputs.redis-ref}}
    secrets: inherit
  build-linux-arm64:
    uses: ./.github/workflows/flow-linux.yml
    needs: [prepare-values]
    with:
      arch: arm64
      os: focal jammy rocky9 azurelinux3 amazonlinux2023 rocky8
      redis-ref: rl_${{needs.prepare-values.outputs.redis-ref}}
    secrets: inherit

  # macOS stays on OSS (redis/redis) per migration plan — not on the private fork.
  macos:
    uses: ./.github/workflows/flow-macos.yml
    needs: [prepare-values]
    with:
      redis-ref: ${{needs.prepare-values.outputs.redis-ref}}
    secrets: inherit
