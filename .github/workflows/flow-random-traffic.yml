name: Flow Random Traffic

on:
  workflow_dispatch:
    inputs:
      redis-ref:
        description: 'Redis ref to checkout'
        default: 'unstable'
      os:
        description: 'OS to run on (leave empty for random)'
        default: ''
      use_prebuilt_images:
        description: 'Pull prebuilt Docker images instead of building locally'
        type: boolean
        default: true
  workflow_call:
    inputs:
      redis-ref:
        description: 'Redis ref to checkout'
        type: string
        default: 'unstable'
      beta-version:
        description: 'Beta version for S3 uploads'
        type: string
        required: false
      quick:
        description: 'Run quick tests'
        type: boolean
        default: false
      os:
        description: 'OS to run on (leave empty for random)'
        type: string
        default: ''
      use_prebuilt_images:
        description: 'Pull prebuilt Docker images instead of building locally'
        type: boolean
        default: true

jobs:
  pick-os:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick-os.outputs.os }}
    steps:
      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisTimeSeries/RedisTimeSeries'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
          ssh-key-name: tracebit_ci_canary
      - name: Pick OS
        id: pick-os
        env:
          INPUT_OS: ${{ inputs.os }}
        run: |
          if [ -n "$INPUT_OS" ]; then
            echo "os=${INPUT_OS}" >> "$GITHUB_OUTPUT"
            echo "Using specified OS: ${INPUT_OS}"
          else
            OS_LIST=(focal jammy rocky8 rocky9 amazonlinux2 amazonlinux2023 mariner2 azurelinux3 alpine noble resolute rocky10 alma8 alma9 alma10 bookworm trixie)
            RANDOM_INDEX=$((RANDOM % ${#OS_LIST[@]}))
            SELECTED=${OS_LIST[$RANDOM_INDEX]}
            echo "os=${SELECTED}" >> "$GITHUB_OUTPUT"
            echo "Randomly selected OS: ${SELECTED}"
          fi

  run-random-traffic:
    name: random-traffic (${{ matrix.mode }}, ${{ matrix.os }})
    needs: pick-os
    # Match flow-linux: ASan containers require the Ubuntu 24.04 host image.
    runs-on: ${{ matrix.mode == 'asan' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: plain
            os: ${{ needs.pick-os.outputs.os }}
            suffix: ''
            san: ''
            vg: ''
          - mode: asan
            os: jammy
            suffix: '-sanitizer'
            san: address
            vg: ''
          - mode: valgrind
            os: jammy
            suffix: '-valgrind'
            san: ''
            vg: '1'
    permissions:
      contents: read
      packages: read
    env:
      REDIS_REF: ${{ inputs.redis-ref || 'unstable' }}
      SAN: ${{ matrix.san }}
      VG: ${{ matrix.vg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Configure Tracebit canary credentials
        if: github.repository == 'RedisTimeSeries/RedisTimeSeries'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
          ssh-key-name: tracebit_ci_canary
      - name: Set Docker Image
        env:
          IMAGE_OS: ${{ matrix.os }}${{ matrix.suffix }}
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_tag="${REDIS_REF:-$(.install/get-redis-ref.sh)}"
          echo "DOCKER_IMAGE=ghcr.io/${repo}/redistimeseries-x86-${IMAGE_OS}:${image_tag}" >> "$GITHUB_ENV"

      - name: Pull Docker Image
        id: pull-image
        if: ${{ inputs.use_prebuilt_images }}
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "::notice title=Docker image::Trying to pull prebuilt image ${DOCKER_IMAGE}"
          docker pull "${DOCKER_IMAGE}"

      - name: Use Pulled Docker Image
        if: ${{ inputs.use_prebuilt_images && steps.pull-image.outcome == 'success' }}
        run: |
          echo "::notice title=Docker image::Using pulled prebuilt image ${DOCKER_IMAGE}"

      - name: Build Docker Image
        if: ${{ !inputs.use_prebuilt_images || steps.pull-image.outcome == 'failure' }}
        env:
          SELECTED_OS: ${{ matrix.os }}
        run: |
          if [ "${{ inputs.use_prebuilt_images }}" = "true" ]; then
            echo "::notice title=Docker image::Prebuilt image pull failed; building locally: ${DOCKER_IMAGE}"
          else
            echo "::notice title=Docker image::Building image locally because prebuilt images are disabled: ${DOCKER_IMAGE}"
          fi
          bash .github/scripts/tracebit-docker.sh build \
            -f "Dockerfile.${SELECTED_OS}" \
            --build-arg REDIS_REF="${REDIS_REF}" \
            --build-arg SANITIZER="${SAN}" \
            --build-arg VALGRIND="${VG}" \
            -t "${DOCKER_IMAGE}" \
            .

      - name: Build module
        run: |
          bash .github/scripts/tracebit-docker.sh run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            make build SAN="${SAN}" VG="${VG}"

      - name: Run Random Traffic
        env:
          TRAFFIC_MODE: ${{ matrix.mode }}
        run: |
          bash .github/scripts/tracebit-docker.sh run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -e TRAFFIC_MODE="${TRAFFIC_MODE}" \
            "${DOCKER_IMAGE}" \
            bash -ec '
              python3 -m pip install redis-command-generator
              exec python3 tests/random-traffic/run.py --mode "$TRAFFIC_MODE"
            '

      - name: Upload random traffic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: random-traffic-${{ matrix.mode }}-${{ matrix.os }}-logs
          path: random-traffic-logs/
